[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[project]
name = "bunker-stats-rs"
version = "0.3.0"
description = "Ultra-fast Rust-powered statistics and time-series utilities for Python."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Adam Ezzat", email = "adamezzat24@gmail.com" }
]

# Runtime Python deps used by the extension / Python helpers.
# Deliberately numpy-only: `import bunker_stats` must not require pandas.
dependencies = [
    "numpy>=1.22"
]

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]

# -------------------------------
# Optional extras
# -------------------------------
# NOTE: this sub-table must stay AFTER every plain `[project]` key above --
# in TOML a table header terminates the preceding table, so placing it earlier
# would swallow `classifiers` into optional-dependencies.
#
# `notebook` powers bunker_stats.notebook -- the pandas/Jupyter reporting layer:
#   pandas     -- DataFrame inputs and the *_report / *_columns return types
#   jinja2     -- pandas ships Styler as an *optional* feature; `df.style` raises
#                 AttributeError without it, so every *_style helper needs it
#   matplotlib -- required by Styler.background_gradient, used by corr_heatmap
#
#   pip install "bunker-stats-rs[notebook]"
#
# `pandas` is the minimal extra: reports and column transforms only, no Stylers.
[project.optional-dependencies]
pandas = [
    "pandas>=1.3",
]
notebook = [
    "pandas>=1.3",
    "jinja2>=3.0",
    "matplotlib>=3.4",
]

[project.urls]
homepage = "https://github.com/AdamEzzat1/bunker-stats"
repository = "https://github.com/AdamEzzat1/bunker-stats"
documentation = "https://github.com/AdamEzzat1/bunker-stats"
issues = "https://github.com/AdamEzzat1/bunker-stats/issues"

# -------------------------------
# maturin packaging configuration
# -------------------------------
[tool.maturin]
# Build the extension with the pyo3/extension-module feature enabled (it is not a
# default dependency feature so that `cargo test`/`cargo bolero` can link libpython).
features = ["extension-module"]
exclude = [
    ".venv/**",
    "venv/**",
    "target/**",
    "dist/**",
    ".hypothesis/**",
    ".pytest_cache/**",
    "**/__pycache__/**",
    "**/*.pyc",
    ".ipynb_checkpoints/**",
]
