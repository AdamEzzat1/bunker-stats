[package]
name = "bunker-stats-rs"
version = "0.3.1"
edition = "2021"

[lib]
name = "bunker_stats_rs"
# cdylib: the Python extension module maturin loads.
# rlib:   lets external `tests/*.rs`, proptest, and bolero targets link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# NOTE: `extension-module` is intentionally NOT enabled here. It is a feature
# (see [features]) that maturin turns on for wheel builds. `cargo test` / `cargo
# bolero` must leave it OFF so the test binary links against a real libpython on
# Linux/macOS instead of relying on symbols supplied by the host interpreter.
pyo3 = { version = "0.22" }
numpy = { version = "0.22" }
statrs = "0.16"
# Rayon available for later parallel speedups, but off by default
rayon = { version = "1.10", optional = true }
rand = "0.8"
nalgebra = "0.29"
libm = "0.2"
rand_pcg = "0.3"
# ADD: FFT for spectral analysis (100× speedup)
rustfft = "6.2"
# NEW v0.2.9: Bitflags for StatsMask in rolling module
bitflags = "2.4"

[dev-dependencies]
proptest = "1"
approx = "0.5"
# Structured fuzzing for boundary/parsing code. Under plain `cargo test` the
# bolero targets run a bounded random search; point cargo-bolero at the same
# targets for coverage-guided fuzzing.
bolero = "0.13"

[features]
default = ["parallel", "extension-module"]
parallel = ["rayon"]                       # rayon-backed parallel loops
extension-module = ["pyo3/extension-module"]  # enabled by maturin for wheel builds

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false